# Applied only in exploration. Saved-map destinations retain precise headings.
controller_server:
  ros__parameters:
    goal_checker:
      yaw_goal_tolerance: 3.141592653589793
    FollowPath:
      approach_velocity_scaling_dist: 0.40
      # Collision checking, curvature regulation, and rotation for sharp turns
      # remain enabled. Rolling goals are replaced before approach slowdown.
