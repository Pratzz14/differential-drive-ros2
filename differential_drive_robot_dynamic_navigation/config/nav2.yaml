amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_beams: 90
    min_particles: 400
    max_particles: 1500
    set_initial_pose: true
    initial_pose: {x: -5.0, y: 0.0, z: 0.0, yaw: 0.0}
    transform_tolerance: 0.5
    tf_broadcast: true
    update_min_d: 0.05
    update_min_a: 0.05
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    # Let short-lived predicted collisions clear while stopped, before invoking
    # recovery behaviors. Collision checking and the safety monitor stay active.
    failure_tolerance: 3.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.45
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.80
      lookahead_time: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 5.0
      cost_scaling_dist: 0.40
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.12
      use_rotate_to_heading: true
      allow_reversing: false
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.09, -0.18], [-0.09, 0.18], [0.26, 0.18], [0.26, -0.18]]"
      footprint_padding: 0.03
      plugins: [obstacle_layer, predicted_obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 9.5
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
          max_obstacle_height: 1.0
      predicted_obstacle_layer:
        plugin: differential_drive_robot_dynamic_navigation/PredictedObstacleLayer
        enabled: true
        topic: /dynamic_obstacles/predicted_cloud_odom
        prediction_timeout: 0.5
        mark_radius: 0.10
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # Smac2D searches positions, not headings: plan with a circle containing
      # the entire robot so a turn at the divider cannot clip a chassis corner.
      robot_radius: 0.34
      footprint_padding: 0.02
      # Use observed occupancy globally; speculative motion stays local so a
      # crossing box does not keep flipping the entire route around the arena.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.12
          obstacle_max_range: 9.5
          raytrace_min_range: 0.12
          raytrace_max_range: 10.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.20
      allow_unknown: true
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      smoother:
        w_smooth: 0.1
        w_data: 0.8
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 500
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    drive_on_heading: {plugin: nav2_behaviors::DriveOnHeading}
    wait: {plugin: nav2_behaviors::Wait}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 2000
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    velocity_timeout: 0.5
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl]
